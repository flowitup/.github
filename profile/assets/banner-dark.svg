<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="flowitup — Software for the people who build.">
  <defs>
    <pattern id="grid-d" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F1B16" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent-d" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="bg-d" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="100%" stop-color="#161310"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#bg-d)"/>
  <rect width="1280" height="360" fill="url(#grid-d)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent-d)"/>
  <g transform="translate(80, 130)">
    <text x="0" y="100" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="120" font-weight="800" letter-spacing="-6" fill="#FAFAF7">flowit<tspan fill="url(#accent-d)">up</tspan></text>
    <text x="6" y="160" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-size="28" font-weight="500" letter-spacing="-0.4" fill="#A3A3A3">Software for the people who build.</text>
  </g>
  <g transform="translate(900, 90)">
    <rect x="0"   y="120" width="280" height="22" rx="4" fill="#F97316"/>
    <rect x="40"  y="84"  width="240" height="22" rx="4" fill="#FB923C"/>
    <rect x="80"  y="48"  width="200" height="22" rx="4" fill="#FDBA74"/>
    <rect x="120" y="12"  width="160" height="22" rx="4" fill="#7A3A12"/>
  </g>
</svg>
